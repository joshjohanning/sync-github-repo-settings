name: sync-github-repo-settings

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Serialize applying runs; a stale queued or rerun commit is rejected before writes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sync-github-repo-settings:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    outputs:
      updated-repositories: ${{ steps.update-repo-settings.outputs.updated-repositories }}
      changed-repositories: ${{ steps.update-repo-settings.outputs.changed-repositories }}
      pending-repositories: ${{ steps.update-repo-settings.outputs.pending-repositories }}
      unchanged-repositories: ${{ steps.update-repo-settings.outputs.unchanged-repositories }}
      warning-repositories: ${{ steps.update-repo-settings.outputs.warning-repositories }}
      failed-repositories: ${{ steps.update-repo-settings.outputs.failed-repositories }}
      results: ${{ steps.update-repo-settings.outputs.results }}
      update-step-outcome: ${{ steps.update-repo-settings.outcome }}
      verify-labels-outcome: ${{ steps.verify-labels.outcome }}
      label-repositories: ${{ steps.label-repos.outputs.repos }}

    steps:
      - uses: actions/checkout@v7

      - name: install prettier
        run: npm install -g prettier

      - name: run prettier
        run: npx prettier --check .

      - name: Test sync results comment
        run: node --test tests/sync-results-comment.test.cjs

      - name: Reject stale main configuration
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main',
            });
            if (context.sha !== data.commit.sha) {
              core.setFailed('This run uses an outdated main commit. Run the workflow again on the current main branch.');
            }

      - name: List repositories with label sync
        id: label-repos
        run: echo "repos=$(yq -o=json -I=0 '[.repos[] | select(has("labels-file")) | .repo]' repos.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Update Repository Settings
        id: update-repo-settings
        # Requires the label-sync release; do not fall back to an older v2.
        uses: joshjohanning/bulk-github-repo-settings-sync-action@v2.17.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repositories-file: 'repos.yml'
          allow-squash-merge: true
          allow-merge-commit: false
          allow-rebase-merge: false
          allow-auto-merge: true
          delete-branch-on-merge: true
          allow-update-branch: true
          code-scanning: true
          secret-scanning: true
          secret-scanning-push-protection: true
          dependabot-alerts: true
          dependabot-security-updates: true
          dry-run: ${{ github.ref != 'refs/heads/main' }} # dry run unless applying main (PRs and non-main dispatches)

      - name: Verify label sync results
        id: verify-labels
        uses: actions/github-script@v9
        env:
          RESULTS_JSON: ${{ steps.update-repo-settings.outputs.results }}
          LABEL_REPOS: ${{ steps.label-repos.outputs.repos }}
        with:
          script: |
            const expected = JSON.parse(process.env.LABEL_REPOS);
            const results = JSON.parse(process.env.RESULTS_JSON);
            if (!Array.isArray(expected) || expected.length === 0) {
              core.setFailed('No repositories in repos.yml configure labels-file; label sync cannot be verified.');
              return;
            }
            if (!Array.isArray(results)) {
              core.setFailed('No repository results were returned; label sync cannot be verified.');
              return;
            }
            const byRepo = new Map(results.map(result => [String(result.repository).toLowerCase(), result]));
            const isOk = sync =>
              sync?.success === true && ['updated', 'would-update', 'unchanged'].includes(sync?.labels);
            const failures = [];
            for (const repo of expected) {
              const sync = byRepo.get(repo.toLowerCase())?.labelsSync;
              if (!isOk(sync)) failures.push(`${repo}: ${sync?.error || 'Missing or invalid label sync result'}`);
            }
            for (const result of results) {
              if (result.labelsSync && !isOk(result.labelsSync) && !expected.some(r => r.toLowerCase() === String(result.repository).toLowerCase())) {
                failures.push(`${result.repository}: ${result.labelsSync.error || 'Invalid label sync result'}`);
              }
            }
            if (failures.length > 0) {
              failures.forEach(message => core.error(message));
              core.setFailed(`Label sync failed or was not confirmed for ${failures.length} repositories.`);
            } else {
              core.info(`Label sync confirmed for ${expected.length} repositories.`);
            }

  comment-sync-results-on-pr:
    runs-on: ubuntu-slim
    needs: sync-github-repo-settings
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && always()
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with sync results
        uses: actions/github-script@v9
        env:
          UPDATED_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.updated-repositories }}
          CHANGED_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.changed-repositories }}
          PENDING_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.pending-repositories }}
          UNCHANGED_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.unchanged-repositories }}
          WARNING_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.warning-repositories }}
          FAILED_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.failed-repositories }}
          RESULTS_JSON: ${{ needs.sync-github-repo-settings.outputs.results }}
          UPDATE_STEP_OUTCOME: ${{ needs.sync-github-repo-settings.outputs.update-step-outcome }}
          VERIFY_LABELS_OUTCOME: ${{ needs.sync-github-repo-settings.outputs.verify-labels-outcome }}
          LABEL_REPOSITORIES: ${{ needs.sync-github-repo-settings.outputs.label-repositories }}
          JOB_RESULT: ${{ needs.sync-github-repo-settings.result }}
        with:
          script: |
            const marker = '<!-- repo-settings-sync-comment -->';

            const updateStepOutcome = process.env.UPDATE_STEP_OUTCOME || '';
            const verifyLabelsOutcome = process.env.VERIFY_LABELS_OUTCOME || '';
            const jobResult = process.env.JOB_RESULT || '';

            const syncDidRun = ['success', 'failure', 'cancelled'].includes(updateStepOutcome);

            const asNumber = (value) => {
              const parsed = Number(value);
              return Number.isFinite(parsed) ? parsed : 0;
            };

            const updatedRepositories = asNumber(process.env.UPDATED_REPOSITORIES);
            const changedRepositories = asNumber(process.env.CHANGED_REPOSITORIES);
            const pendingRepositories = asNumber(process.env.PENDING_REPOSITORIES);
            const unchangedRepositories = asNumber(process.env.UNCHANGED_REPOSITORIES);
            const warningRepositories = asNumber(process.env.WARNING_REPOSITORIES);
            const failedRepositories = asNumber(process.env.FAILED_REPOSITORIES);

            let results = [];
            try {
              results = JSON.parse(process.env.RESULTS_JSON || '[]');
              if (!Array.isArray(results)) {
                results = [];
              }
            } catch {
              results = [];
            }

            const normalizeRepoName = (result, index) => {
              return (
                result?.repository ||
                result?.repo ||
                result?.repositoryName ||
                result?.name ||
                result?.full_name ||
                `repo-${index + 1}`
              );
            };

            const hasChange = (result) => {
              if (typeof result?.changed === 'boolean') return result.changed;
              if (typeof result?.wouldChange === 'boolean') return result.wouldChange;
              if (typeof result?.hasChanges === 'boolean') return result.hasChanges;
              if (result?.status && String(result.status).toLowerCase() === 'changed') return true;
              if (Array.isArray(result?.subResults)) {
                return result.subResults.some((subResult) => String(subResult?.status || '').toLowerCase() === 'changed');
              }
              if (Array.isArray(result?.changes)) return result.changes.length > 0;
              return false;
            };

            const hasPending = (result) => {
              if (typeof result?.pending === 'boolean') return result.pending;
              if (result?.status && String(result.status).toLowerCase() === 'pending') return true;
              if (Array.isArray(result?.subResults)) {
                return result.subResults.some((subResult) => String(subResult?.status || '').toLowerCase() === 'pending');
              }
              return false;
            };

            const hasFailure = (result) => {
              if (result?.success === false) return true;
              if (typeof result?.failed === 'boolean') return result.failed;
              if (result?.status && String(result.status).toLowerCase() === 'failed') return true;
              return Boolean(result?.error);
            };

            let labelRepositories = [];
            try {
              labelRepositories = JSON.parse(process.env.LABEL_REPOSITORIES || '[]').map((repo) => String(repo).toLowerCase());
            } catch {
              labelRepositories = [];
            }

            // Upstream reports label errors as warnings on otherwise-successful repositories.
            const hasLabelFailure = (result) => {
              const expected = labelRepositories.includes(String(result?.repository || '').toLowerCase());
              if (!expected && !result?.labelsSync) return false;
              return (
                result?.labelsSync?.success !== true ||
                !['updated', 'would-update', 'unchanged'].includes(result?.labelsSync?.labels)
              );
            };

            // Match the summary table from the pinned bulk sync action.
            const syncKindLabels = {
              'dependabot-sync': 'dependabot.yml',
              'gitignore-sync': '.gitignore',
              'ruleset-sync': 'ruleset',
              'ruleset-create': 'rulesets',
              'ruleset-update': 'rulesets',
              'ruleset-delete': 'rulesets',
              'pr-template-sync': 'PR template',
              'workflow-files-sync': 'workflow files',
              'autolinks-sync': 'autolinks',
              'labels-sync': 'labels',
              'environments-sync': 'environments',
              'copilot-instructions-sync': 'copilot-instructions.md',
              'codeowners-sync': 'CODEOWNERS',
              'package-json-sync': 'package.json',
              'file-sync': 'file sync',
            };

            const escapeTableText = (value) =>
              String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '&#124;')
                .replace(/\r\n?|\n/g, '<br>');

            const formatPrReference = (subResult, repoName) => {
              const number = String(subResult.prNumber);
              if (!/^[1-9]\d*$/.test(number)) {
                core.warning(`Invalid pull request number in sync results for ${repoName}.`);
                return `PR ${escapeTableText(number)}`;
              }

              return `PR \`${escapeTableText(repoName).replace(/`/g, '&#96;')}#${number}\``;
            };

            const formatSubResult = (subResult, repoName) => {
              const message = escapeTableText(subResult.message ?? 'No details provided');
              const label = syncKindLabels[subResult.kind];
              if (!label) return message;

              const syncStatus = subResult.syncStatus;
              if (!syncStatus) {
                return subResult.kind.startsWith('ruleset-') ? `${label}: ${message}` : message;
              }
              if (typeof syncStatus !== 'string') {
                core.warning(`Invalid sync status in results for ${repoName}.`);
                return message;
              }

              const hasPr = subResult.prNumber != null;
              const prRef = hasPr ? formatPrReference(subResult, repoName) : '';
              if (syncStatus === 'pr-up-to-date') return `${label} ${prRef} up-to-date (pending merge)`;
              if (syncStatus === 'stale-pr-closed') return `Closed stale ${prRef} for ${label}`;
              if (syncStatus === 'would-close-stale-pr') return `Would close stale ${prRef} for ${label}`;
              if (syncStatus === 'would-update-pr') return `Would update existing ${prRef} for ${label}`;
              if (syncStatus.startsWith('would-')) return `Would sync ${label}`;
              return hasPr ? `Would sync ${label} (${prRef})` : `Would sync ${label}`;
            };

            const summaryRow = (result, index) => {
              const repoName = normalizeRepoName(result, index);
              const failed = hasFailure(result);
              const labelFailed = hasLabelFailure(result);
              let status;
              if (failed || labelFailed) status = '❌ Failed';
              else if (result?.archived) status = '⏭️ Skipped';
              else if (result?.hasWarnings) status = '⚠️ Warning';
              else if (hasChange(result)) status = '✅ Changed';
              else if (hasPending(result)) status = '🔄 Pending';
              else status = '➖ No changes';

              const subResults = Array.isArray(result?.subResults) ? result.subResults : [];
              let messages;
              if (failed) {
                messages = [escapeTableText(result?.error || 'Repository sync failed')];
              } else if (result?.archived) {
                messages = ['Repository is archived'];
              } else {
                messages = subResults
                  .filter((subResult) => ['warning', 'changed', 'pending'].includes(subResult?.status))
                  .map((subResult) => formatSubResult(subResult, repoName));
              }
              if (labelFailed) {
                const hasLabelWarning = !failed && !result?.archived && subResults.some(
                  (subResult) => subResult?.kind === 'labels-sync' && subResult?.status === 'warning' && subResult?.message
                );
                const error = !hasLabelWarning && result?.labelsSync?.error
                  ? `: ${escapeTableText(result.labelsSync.error)}`
                  : '';
                messages.push(`Label sync failed or unconfirmed${error}`);
              }
              const details = messages.length > 0 ? messages.join('; ') : 'No changes needed';
              return `| ${escapeTableText(repoName)} | ${status} | ${details} |`;
            };

            const changedRepoNames = [];
            const pendingRepoNames = [];
            const failedRepoNames = [];
            const labelFailedRepoNames = [];
            const missingLabelRepoNames = [];
            let labelFailuresCountedUnchanged = 0;

            for (let i = 0; i < results.length; i += 1) {
              const item = results[i];
              const repoName = normalizeRepoName(item, i);
              const changed = hasChange(item);
              const pending = hasPending(item);
              const failed = hasFailure(item);
              if (changed) changedRepoNames.push(repoName);
              if (pending) pendingRepoNames.push(repoName);
              if (hasLabelFailure(item)) {
                labelFailedRepoNames.push(repoName);
                if (!failed && !changed && !pending) labelFailuresCountedUnchanged += 1;
              }
              if (failed || hasLabelFailure(item)) failedRepoNames.push(repoName);
            }

            if (results.length > 0) {
              const reportedRepos = new Set(results.map((result) => String(result?.repository || '').toLowerCase()));
              for (const repoName of new Set(labelRepositories)) {
                if (!reportedRepos.has(repoName)) {
                  missingLabelRepoNames.push(repoName);
                  labelFailedRepoNames.push(repoName);
                  failedRepoNames.push(repoName);
                }
              }
            }

            const effectivePendingRepositories = pendingRepositories > 0 ? pendingRepositories : pendingRepoNames.length;
            const effectiveFailedRepositories = Math.max(failedRepositories, failedRepoNames.length);
            const effectiveUnchangedRepositories = Math.max(0, unchangedRepositories - labelFailuresCountedUnchanged);

            const outcomeEmoji = jobResult === 'success' ? '✅' : '⚠️';
            const previewLabel = 'Dry-run preview';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const processedText = syncDidRun ? String(updatedRepositories) : 'not available';
            const changedText = syncDidRun ? String(changedRepositories) : 'not available';
            const pendingText = syncDidRun ? String(effectivePendingRepositories) : 'not available';
            const countsAvailable = syncDidRun && results.length > 0;
            const unchangedText = countsAvailable ? String(effectiveUnchangedRepositories) : 'not available';
            const warningText = countsAvailable ? String(warningRepositories) : 'not available';
            const failedText = countsAvailable ? String(effectiveFailedRepositories) : 'not available';

            const lines = [
              marker,
              `### ${outcomeEmoji} Repository settings sync result (${previewLabel})`,
              '',
              `- Processed repositories: ${processedText}`,
              `- Repositories with changes: ${changedText}`,
              `- Repositories with pending sync PRs: ${pendingText}`,
              `- Repositories without changes: ${unchangedText}`,
              `- Repositories with warnings: ${warningText}`,
              `- Repositories with failures: ${failedText}`,
              '',
            ];

            if (!syncDidRun) {
              lines.push('The repository sync step did not run because an earlier step failed or the job was interrupted.');
              lines.push('');
            } else if (updateStepOutcome !== 'success') {
              lines.push('The sync step did not complete successfully. Review the workflow logs for details.');
              lines.push('');
            } else if (verifyLabelsOutcome !== 'success') {
              lines.push('The sync step completed, but label sync verification failed.');
              if (labelFailedRepoNames.length > 0) {
                lines.push('');
                lines.push(`Label sync failed or unconfirmed: ${labelFailedRepoNames.join(', ')}`);
              }
              lines.push('');
            } else if (jobResult !== 'success') {
              lines.push('The job did not complete successfully. Review the workflow logs for details.');
              lines.push('');
            }

            if (!syncDidRun) {
              lines.push('No sync diff is available for this run.');
              lines.push('');
            } else if (jobResult !== 'success') {
              lines.push('The preview is incomplete or failed verification; repository settings and labels are not confirmed in sync.');
              lines.push('');
            } else if (changedRepositories > 0) {
              lines.push('Changes were detected in this preview.');
              if (changedRepoNames.length > 0) {
                lines.push('');
                lines.push(`Changed repositories: ${changedRepoNames.join(', ')}`);
              }
              lines.push('');
            } else if (effectivePendingRepositories > 0) {
              lines.push('No new changes detected, but existing sync PRs are pending merge.');
              lines.push('');
            } else {
              lines.push('No changes detected. Repository settings are already in sync.');
              lines.push('');
            }

            if (pendingRepoNames.length > 0) {
              lines.push(`Pending sync PR repositories: ${pendingRepoNames.join(', ')}`);
              lines.push('');
            }

            if (failedRepoNames.length > 0) {
              lines.push(`Failed repositories: ${failedRepoNames.join(', ')}`);
              lines.push('');
            }

            lines.push(`[View workflow run](${runUrl})`);
            lines.push('');

            if (results.length > 0) {
              lines.push('#### Per-repository summary');
              lines.push('');
              lines.push('| Repository | Status | Details |');
              lines.push('| --- | --- | --- |');
              results.forEach((result, index) => lines.push(summaryRow(result, index)));
              missingLabelRepoNames.forEach((repoName) =>
                lines.push(`| ${escapeTableText(repoName)} | ❌ Failed | No repository result was returned to verify label sync |`)
              );
              lines.push('');

              lines.push('<details>');
              lines.push('<summary>Per-repository results JSON</summary>');
              lines.push('');
              lines.push('```json');
              lines.push(JSON.stringify(results, null, 2));
              lines.push('```');
              lines.push('</details>');
            }

            const body = lines.join('\n');

            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existingComments = comments.filter((comment) => comment.body?.includes(marker));

            if (existingComments.length > 0) {
              const existingComment = existingComments[existingComments.length - 1];
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated existing PR comment ${existingComment.id}`);

              const duplicateComments = existingComments.slice(0, -1);
              for (const duplicateComment of duplicateComments) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: duplicateComment.id,
                });
                core.info(`Deleted duplicate PR comment ${duplicateComment.id}`);
              }
            } else {
              const response = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created PR comment ${response.data.id}`);
            }
